<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkVPN ❄️ — Instagram‑стиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0a0c10;
            color: #f0f0f0;
        }

        /* снежинки */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .snow i {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        /* главный контейнер как Instagram лента */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 2;
        }

        /* шапка как в Instagram */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2c313c;
            margin-bottom: 16px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #e0f0ff, #b0d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-icons {
            display: flex;
            gap: 20px;
        }
        .header-icons span {
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* истории (сторис) */
        .stories {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 12px 0 20px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .story {
            text-align: center;
            min-width: 70px;
        }
        .story-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b0d4ff, #4a7a9e);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .story-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1a1e26;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .story-name {
            font-size: 0.7rem;
            color: #b0b0b0;
        }

        /* карточка поста */
        .post {
            background: #1a1e26;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #2c313c;
            overflow: hidden;
        }
        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }
        .post-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #b0d4ff, #4a7a9e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .post-author {
            font-weight: bold;
            flex: 1;
        }
        .post-time {
            font-size: 0.7rem;
            color: #8e94a3;
        }
        .post-content {
            padding: 0 16px 16px;
        }
        .post-text {
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .proxy-code {
            background: #0f1217;
            border-radius: 16px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.7rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 12px 0;
            border: 1px solid #2c313c;
        }
        .post-stats {
            display: flex;
            gap: 20px;
            padding: 10px 16px;
            border-top: 1px solid #2c313c;
            color: #8e94a3;
            font-size: 0.8rem;
        }
        button {
            background: #b0d4ff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #0a0c10;
            cursor: pointer;
            margin-top: 8px;
        }

        .instruction-step {
            background: #0f1217;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .step-num {
            width: 32px;
            height: 32px;
            background: #b0d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0c10;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #6c727f;
            font-size: 0.7rem;
        }
        a {
            color: #b0d4ff;
            text-decoration: none;
        }
        .glass-card {
            background: rgba(26, 30, 38, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 20px;
        }
    </style>
</head>

<script>

    // Рендер ленты

        if (section === 'proxy') {
            // пост с прокси

            post.innerHTML = `
                <div class="post-header">
                    <div class="post-avatar">📡</div>
                    <div class="post-author">DarkVPN Proxy</div>
                    <div class="post-time">только что</div>

                <div class="post-content">
                    <div class="post-text"><strong>🌍 140+ рабочих прокси VLESS+Reality</strong><br>Скопируй и импортируй в Throne / Hiddify</div>
                    <div class="proxy-code">${escapeHtml(PROXIES_LIST)}</div>
                    <button id="copyProxiesBtn">📋 Копировать все прокси</button>
                </div>
                <div class="post-stats">
                    <span>❤️ 1.2k</span>

            `;

                navigator.clipboard.writeText(PROXIES_LIST);

        else if (section === 'howto') {
            feed.innerHTML = `
                <div class="post">

                        <div class="post-avatar">📖</div>
                        <div class="post-author">DarkVPN Guide</div>

                    <div class="post-content">

                        <div class="instruction-step"><div class="step-num">3</div> Вставь в файл <code>proxies.txt</code></div>
                        <div class="instruction-step"><div class="step-num">4</div> Импорт в Throne → Готово</div>
                        <div class="instruction-step"><div class="step-num">📱</div> Для телефона: Hiddify / Sing-box</div>
                    </div>
                    <div class="post-stats"><span>❤️ 850</span><span>💬 23</span><span>📤 67</span></div>

        }
        else if (section === 'info') {
            feed.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="post-avatar">💎</div>

                    <div class="post-content">

        else if (section === 'github') {
            feed.innerHTML = `

                    <div class="post-header">
                        <div class="post-avatar">🐙</div>
                        <div class="post-author">web-pentest</div>

                    </div>
                    <div class="post-stats"><span>❤️ 560</span><span>💬 34</span><span>📤 89</span></div>
                </div>
            `;

    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Обработка кликов по историям
    document.querySelectorAll('.story').forEach(story => {
        story.addEventListener('click', () => {
            const section = story.dataset.section;
            renderFeed(section);
        });
    });

    // Запускаем ленту с прокси
    renderFeed('proxy');

    // снежинки
    function createSnow() {
        const snowContainer = document.getElementById('snow');
        for (let i = 0; i < 60; i++) {
            const snowflake = document.createElement('i');
            snowflake.style.left = Math.random() * 100 + '%';
            snowflake.style.width = snowflake.style.height = Math.random() * 5 + 2 + 'px';
            snowflake.style.animationDuration = Math.random() * 4 + 3 + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowContainer.appendChild(snowflake);
        }
    }
    createSnow();
</script>
</body>
</html>
