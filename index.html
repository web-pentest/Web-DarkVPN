<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkVPN ∞ — 400+ прокси | обход блокировок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'JetBrains Mono', monospace;
        }

        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #03060c 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* анимированный фон (вайбар) */
        .vibe-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(100,150,200,0.1) 0%, rgba(0,0,0,0) 70%);
            animation: pulseBg 6s ease infinite;
        }
        @keyframes pulseBg {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        /* снежинки */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snow i {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        /* главный контейнер */
        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* стеклянная шапка */
        .glass-header {
            background: rgba(20, 30, 45, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(100, 150, 200, 0.4);
            box-shadow: 0 0 30px rgba(100, 150, 200, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo h1 {
            font-size: 2.4rem;
            background: linear-gradient(135deg, #ffffff, #80b0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(128,176,255,0.3);
        }
        .logo p {
            color: #8ab3cf;
            font-size: 0.8rem;
        }
        .badge {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 8px 20px;
            border: 1px solid #80b0ff;
        }

        /* крутые кнопки-виджеты */
        .widget-bar {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .widget {
            background: rgba(20, 30, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(100,150,200,0.5);
            transition: 0.3s;
            cursor: pointer;
        }
        .widget:hover {
            background: #80b0ff20;
            transform: translateY(-3px);
            box-shadow: 0 0 15px #80b0ff;
        }

        /* основная карточка */
        .post {
            background: rgba(15, 25, 35, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(100, 150, 200, 0.4);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .post-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(100,150,200,0.2);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #80b0ff, #4060a0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .post-title {
            flex: 1;
        }
        .post-title h2 {
            font-size: 1.5rem;
            color: #d0e4ff;
        }

        .post-content {
            padding: 24px;
        }
        .proxy-count {
            font-size: 1.3rem;
            font-weight: bold;
            color: #80b0ff;
            margin-bottom: 20px;
        }
        .test-proxy {
            background: rgba(0,0,0,0.4);
            border-radius: 28px;
            padding: 20px;
            margin: 20px 0;
        }
        .code-block {
            background: #0a0f1a;
            border-radius: 24px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 16px 0;
            border: 1px solid #2c3e50;
        }
        button {
            background: linear-gradient(135deg, #80b0ff, #4060a0);
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            font-size: 1rem;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px #80b0ff;
        }

        /* гифка с аниме */
        .anime-footer {
            background: rgba(0,0,0,0.5);
            border-radius: 32px;
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(128,176,255,0.3);
        }
        .anime-gif {
            width: 100%;
            max-width: 200px;
            border-radius: 24px;
            margin: 0 auto;
            display: block;
        }
        .anime-gif img {
            width: 100%;
            border-radius: 24px;
            filter: drop-shadow(0 0 10px #80b0ff);
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #6c8eb0;
            font-size: 0.7rem;
        }
        a {
            color: #80b0ff;
            text-decoration: none;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        @media (max-width: 700px) {
            .container { padding: 12px; }
            .glass-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="vibe-bg"></div>
<div class="snow" id="snow"></div>

<div class="container">
    <div class="glass-header">
        <div class="logo">
            <h1>❄️ DarkVPN ∞</h1>
            <p>обход блокировок | 140–400+ прокси</p>
        </div>
        <div class="badge">⚡ VLESS+Reality | Shadowsocks</div>
    </div>

    <!-- виджеты -->
    <div class="widget-bar">
        <div class="widget" data-section="proxy">📡 Прокси</div>
        <div class="widget" data-section="test">🧪 Тестовый прокси</div>
        <div class="widget" data-section="howto">📖 Инструкция</div>
        <div class="widget" data-section="github">🐙 GitHub</div>
    </div>

    <!-- динамический контент -->
    <div id="content"></div>

    <!-- аниме тянка танцует -->
    <div class="anime-footer">
        <div class="anime-gif">
            <img src="https://media.tenor.com/9JjVrYd2xK4AAAAi/peach-goma.gif" alt="танцующая аниме тянка">
        </div>
        <p style="margin-top: 8px;">✦ танцуй, пока интернет свободен ✦</p>
    </div>

    <footer>
        ❄️ <a href="https://github.com/web-pentest/DarkVPN" target="_blank">DarkVPN на GitHub</a> • <a href="https://github.com/web-pentest" target="_blank">@web-pentest</a>
    </footer>
</div>

<script>
    const PROXY_FILE_URL = 'https://raw.githubusercontent.com/web-pentest/DarkVPN/main/proxies.txt';
    const TEST_PROXY = 'ss://YWVzLTI1Ni1jZmI6WG44aktkbURNMDBJZU8lIyQjZkpBTXRzRUFFVU9wSC9ZV1l0WXFERm5UMFNW@103.186.154.30:38388#🇻🇳 Vietnam, Hải Dương [BL]';
    let cachedProxies = 'Загрузка...';

    async function loadProxies() {
        try {
            const res = await fetch(PROXY_FILE_URL);
            cachedProxies = await res.text();
        } catch(e) {
            cachedProxies = 'Ошибка загрузки. Проверь интернет.';
        }
    }

    function render(section) {
        const container = document.getElementById('content');
        if (section === 'proxy') {
            container.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="avatar">📡</div>
                        <div class="post-title"><h2>🌍 Прокси DarkVPN</h2></div>
                    </div>
                    <div class="post-content">
                        <div class="proxy-count">⚡ 140–400+ VLESS+Reality прокси</div>
                        <div class="code-block" id="proxyText">${cachedProxies}</div>
                        <button id="copyProxiesBtn">📋 Копировать все прокси</button>
                    </div>
                </div>
            `;
            document.getElementById('copyProxiesBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(cachedProxies);
                alert('✅ Прокси скопированы! Импортируй в Throne / Hiddify');
            });
        }
        else if (section === 'test') {
            container.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="avatar">🧪</div>
                        <div class="post-title"><h2>Тестовый прокси</h2></div>
                    </div>
                    <div class="post-content">
                        <div class="test-proxy">
                            <strong>🔹 Shadowsocks (Вьетнам)</strong>
                            <div class="code-block">${TEST_PROXY}</div>
                            <button id="copyTestBtn">📋 Копировать тестовый прокси</button>
                        </div>
                        <p style="margin-top:16px;">✅ Подходит для быстрой проверки. Просто импортируй в любой Shadowsocks-клиент.</p>
                    </div>
                </div>
            `;
            document.getElementById('copyTestBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(TEST_PROXY);
                alert('✅ Тестовый прокси скопирован!');
            });
        }
        else if (section === 'howto') {
            container.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="avatar">📖</div>
                        <div class="post-title"><h2>Инструкция за 3 шага</h2></div>
                    </div>
                    <div class="post-content">
                        <div class="flex-between">
                            <div class="widget">1. Скачай <strong>Throne</strong> (Hiddify) — <a href="https://github.com/hiddify/hiddify-next/releases" target="_blank">GitHub релиз</a></div>
                            <div class="widget">2. Скачай файл с прокси: <a href="${PROXY_FILE_URL}" target="_blank">proxies.txt</a></div>
                            <div class="widget">3. Импортируй файл → Подключись</div>
                        </div>
                        <button id="copyUrlBtn">📋 Копировать ссылку на файл прокси</button>
                    </div>
                </div>
            `;
            document.getElementById('copyUrlBtn')?.addEventListener('click', () => {
                navigator.clipboard.writeText(PROXY_FILE_URL);
                alert('✅ Ссылка на файл прокси скопирована!');
            });
        }
        else if (section === 'github') {
            container.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="avatar">🐙</div>
                        <div class="post-title"><h2>web-pentest</h2></div>
                    </div>
                    <div class="post-content">
                        <div class="code-block">
                            🔗 <a href="https://github.com/web-pentest/DarkVPN" target="_blank">DarkVPN — главный репозиторий</a><br>
                            🔗 <a href="https://github.com/web-pentest" target="_blank">github.com/web-pentest</a>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    document.querySelectorAll('.widget').forEach(w => {
        w.addEventListener('click', () => render(w.dataset.section));
    });

    loadProxies().then(() => render('proxy'));

    // снежинки
    function createSnow() {
        const snowDiv = document.getElementById('snow');
        for (let i = 0; i < 70; i++) {
            const flake = document.createElement('i');
            flake.style.left = Math.random() * 100 + '%';
            flake.style.width = flake.style.height = Math.random() * 6 + 2 + 'px';
            flake.style.animationDuration = Math.random() * 5 + 3 + 's';
            flake.style.animationDelay = Math.random() * 5 + 's';
            snowDiv.appendChild(flake);
        }
    }
    createSnow();
</script>
</body>
</html>
