<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkVPN ❄️ — Instagram style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0a0c10;
            color: #f0f0f0;
        }

        .snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .snow i {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 2;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #2c313c;
            margin-bottom: 16px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #e0f0ff, #b0d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 1.4rem;
        }

        .stories {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 12px 0 20px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .story {
            text-align: center;
            min-width: 70px;
            cursor: pointer;
        }
        .story-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #b0d4ff, #4a7a9e);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }
        .story-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #1a1e26;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .story-name {
            font-size: 0.7rem;
            color: #b0b0b0;
        }

        .post {
            background: #1a1e26;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #2c313c;
            overflow: hidden;
        }
        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }
        .post-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #b0d4ff, #4a7a9e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .post-author {
            font-weight: bold;
            flex: 1;
        }
        .post-time {
            font-size: 0.7rem;
            color: #8e94a3;
        }
        .post-content {
            padding: 0 16px 16px;
        }
        .post-text {
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .proxy-code {
            background: #0f1217;
            border-radius: 16px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.7rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 12px 0;
            border: 1px solid #2c313c;
        }
        button {
            background: #b0d4ff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            color: #0a0c10;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        .post-stats {
            display: flex;
            gap: 20px;
            padding: 10px 16px;
            border-top: 1px solid #2c313c;
            color: #8e94a3;
            font-size: 0.8rem;
        }
        .instruction-step {
            background: #0f1217;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .step-num {
            width: 32px;
            height: 32px;
            background: #b0d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0a0c10;
        }
        a {
            color: #b0d4ff;
            text-decoration: none;
        }
        footer {
            text-align: center;
            padding: 24px;
            color: #6c727f;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="container">
    <div class="header">
        <div class="logo">❄️ DarkVPN</div>
        <div class="header-icons">❤️ 💬 📌</div>
    </div>

    <div class="stories">
        <div class="story" data-section="proxy">
            <div class="story-ring"><div class="story-img">📡</div></div>
            <div class="story-name">Прокси</div>
        </div>
        <div class="story" data-section="howto">
            <div class="story-ring"><div class="story-img">📖</div></div>
            <div class="story-name">Инструкция</div>
        </div>
        <div class="story" data-section="github">
            <div class="story-ring"><div class="story-img">🐙</div></div>
            <div class="story-name">GitHub</div>
        </div>
    </div>

    <div id="feed"></div>

    <footer>
        ❄️ <a href="https://github.com/web-pentest/DarkVPN" target="_blank">DarkVPN на GitHub</a> • <a href="https://github.com/web-pentest" target="_blank">@web-pentest</a>
    </footer>
</div>

<script>
    const PROXY_FILE_URL = 'https://raw.githubusercontent.com/web-pentest/DarkVPN/main/proxies.txt';
    const PROXIES_LIST_PLACEHOLDER = 'загрузка прокси...';

    let cachedProxies = '';

    async function loadProxies() {
        try {
            const res = await fetch(PROXY_FILE_URL);
            const text = await res.text();
            cachedProxies = text;
            document.getElementById('proxyText')?.classList?.remove('loading');
            if (document.getElementById('proxyText')) {
                document.getElementById('proxyText').innerText = cachedProxies;
            }
        } catch(e) {
            cachedProxies = 'Ошибка загрузки прокси. Проверь интернет или зайди позже.';
            if (document.getElementById('proxyText')) {
                document.getElementById('proxyText').innerText = cachedProxies;
            }
        }
    }

    function renderFeed(section) {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';

        if (section === 'proxy') {
            feed.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="post-avatar">📡</div>
                        <div class="post-author">DarkVPN Proxy</div>
                        <div class="post-time">обновляется ежедневно</div>
                    </div>
                    <div class="post-content">
                        <div class="post-text"><strong>🌍 140+ прокси VLESS+Reality</strong><br>Скопируй ссылки и импортируй в Throne / Hiddify</div>
                        <div class="proxy-code" id="proxyText">загрузка...</div>
                        <button id="copyProxiesBtn">📋 Копировать все прокси</button>
                    </div>
                    <div class="post-stats"><span>❤️ 1.2k</span><span>💬 45</span><span>📤 128</span></div>
                </div>
            `;
            loadProxies();
            const copyBtn = document.getElementById('copyProxiesBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', () => {
                    if (cachedProxies && cachedProxies !== 'Ошибка загрузки прокси. Проверь интернет или зайди позже.') {
                        navigator.clipboard.writeText(cachedProxies);
                        alert('✅ Прокси скопированы! Вставьте в файл .txt и импортируйте в Throne');
                    } else {
                        alert('⚠️ Прокси ещё не загрузились, попробуй через минуту');
                    }
                });
            }
        }
        else if (section === 'howto') {
            feed.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="post-avatar">📖</div>
                        <div class="post-author">DarkVPN Guide</div>
                        <div class="post-time">просто и быстро</div>
                    </div>
                    <div class="post-content">
                        <div class="instruction-step"><div class="step-num">1</div> Скачай <strong>Throne (Hiddify)</strong> — <a href="https://github.com/hiddify/hiddify-next/releases" target="_blank">GitHub релиз</a></div>
                        <div class="instruction-step"><div class="step-num">2</div> Скачай файл с прокси: <br><strong><a href="${PROXY_FILE_URL}" target="_blank">${PROXY_FILE_URL}</a></strong><br><button id="copyUrlBtn">📋 Копировать ссылку</button></div>
                        <div class="instruction-step"><div class="step-num">3</div> Импортируй файл в Throne → Подключись</div>
                        <div class="instruction-step"><div class="step-num">📱</div> Для телефона: Hiddify / Sing-box</div>
                    </div>
                    <div class="post-stats"><span>❤️ 850</span><span>💬 23</span><span>📤 67</span></div>
                </div>
            `;
            const copyUrlBtn = document.getElementById('copyUrlBtn');
            if (copyUrlBtn) {
                copyUrlBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(PROXY_FILE_URL);
                    alert('✅ Ссылка на файл прокси скопирована!');
                });
            }
        }
        else if (section === 'github') {
            feed.innerHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="post-avatar">🐙</div>
                        <div class="post-author">web-pentest</div>
                        <div class="post-time">github</div>
                    </div>
                    <div class="post-content">
                        <div class="post-text"><strong>🔗 Мои проекты</strong></div>
                        <div class="proxy-code"><a href="https://github.com/web-pentest/DarkVPN" target="_blank">💀 DarkVPN</a><br><a href="https://github.com/web-pentest" target="_blank">🐙 github.com/web-pentest</a></div>
                    </div>
                    <div class="post-stats"><span>❤️ 560</span><span>💬 34</span><span>📤 89</span></div>
                </div>
            `;
        }
    }

    document.querySelectorAll('.story').forEach(story => {
        story.addEventListener('click', () => {
            renderFeed(story.dataset.section);
        });
    });

    renderFeed('proxy');

    function createSnow() {
        const snowContainer = document.getElementById('snow');
        for (let i = 0; i < 60; i++) {
            const flake = document.createElement('i');
            flake.style.left = Math.random() * 100 + '%';
            flake.style.width = flake.style.height = Math.random() * 5 + 2 + 'px';
            flake.style.animationDuration = Math.random() * 4 + 3 + 's';
            flake.style.animationDelay = Math.random() * 5 + 's';
            snowContainer.appendChild(flake);
        }
    }
    createSnow();
</script>
</body>
</html>
